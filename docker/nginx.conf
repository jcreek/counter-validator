server {
    listen 80;
    server_name _;

    # Vue SPA assets and entry point
    root /usr/share/nginx/html;
    index index.html;

    # Some validator endpoints accept file uploads (TR/PR/IR JSON, Excel, etc.)
    client_max_body_size 100M;

    # Docker's embedded DNS. Combined with a variabilised proxy_pass below, this
    # makes nginx re-resolve the validator-web service name at request time
    # instead of caching its IP at startup — so recreating the web container
    # (a routine redeploy) no longer leaves the frontend serving 502s, and the
    # frontend can start even if web isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Django/DRF static assets (admin, browseable API). Populated by
    # validator-web's `manage.py collectstatic` into the shared volume.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # User-uploaded media (validation files awaiting cleanup), served straight
    # from the shared media_data volume that validator-web/worker write to.
    # Django only serves /media/ when DEBUG=True, so it must be served here.
    # NOTE: no per-user auth — any file is downloadable by anyone with its URL
    # (unguessable random filename + expiry are the only protection). See the
    # security note in docker-compose.yml before exposing this publicly.
    location /media/ {
        alias /var/www/media/;
        access_log off;
    }

    # Django REST API
    location /api/ {
        # `set` + variable proxy_pass forces runtime DNS resolution (see resolver
        # above). Host carries the original host:port ($http_host, not $host which
        # strips the port) so Django's CSRF origin check matches the browser's
        # Origin on any published port.
        set $upstream_web validator-web;
        proxy_pass http://$upstream_web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django admin. Served under /django-admin/ (DJANGO_ADMIN_PATH) rather than
    # /admin/ so it doesn't shadow the Vue SPA's own /admin/* routes (e.g.
    # /admin/users), which must fall through to the SPA index.html below.
    location /django-admin/ {
        set $upstream_web validator-web;
        proxy_pass http://$upstream_web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue SPA fallback — try the requested file, then directory, then index.html
    # so client-side routing works on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
